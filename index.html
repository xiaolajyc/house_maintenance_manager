<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>房屋维护管理 V45</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#667085;--line:#e1e5ea;--primary:#2563eb;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--shadow:0 3px 14px rgba(15,23,42,.06)}
*{box-sizing:border-box}html{touch-action:pan-y}body{touch-action:pan-y;margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1120px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:23px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}.nav button,.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px}.nav button.active,.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{background:#fee2e2;border-color:#fecaca;color:#991b1b}.btn.small{font-size:12px;padding:7px 9px}
.panel{background:var(--card);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.section{margin-bottom:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.task-list{display:grid;gap:9px}.task{border:1px solid var(--line);border-radius:13px;padding:12px}.task-main{display:flex;justify-content:space-between;gap:12px}.task-name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#334155}.badge.red{background:#fee2e2;color:#991b1b}.badge.orange{background:#ffedd5;color:#9a3412}.badge.green{background:#dcfce7;color:#166534}.badge.gray{background:#f3f4f6;color:#4b5563}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.toolbar input{width:min(360px,100%)}
.form{display:grid;gap:11px}.form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--text)}.form textarea{min-height:90px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{background:#f8fafc;border:1px solid var(--line);padding:11px;border-radius:10px;font-size:13px;color:var(--muted)}.sub-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef0f3}.sub-row:last-child{border-bottom:0}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.46);align-items:center;justify-content:center;padding:16px;z-index:100}.modal.show{display:flex}.modal-box{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.modal-head h3{margin:0;font-size:18px}.close{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px}

.drive-progress{width:100%;box-sizing:border-box;background:#f7fbfe;border:1px solid #dce8ef;border-radius:14px;padding:13px 15px;margin-top:14px;display:none}
.drive-progress.show{display:block}
.drive-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:#193a53;font-size:14px}
.drive-progress-detail{margin-top:4px;color:#7890a2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drive-progress-track{height:8px;background:#eaf1f5;border-radius:999px;overflow:hidden;margin-top:10px}
.drive-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#2d9bea,#0f75c2);border-radius:999px;transition:width .18s ease}
.drive-progress.indeterminate .drive-progress-bar{width:42%;animation:driveProgressInd 1.05s ease-in-out infinite}
@keyframes driveProgressInd{0%{transform:translateX(-115%)}100%{transform:translateX(260%)}}


.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;display:none;z-index:200}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
.checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}
.check-item{display:flex!important;align-items:flex-start;gap:8px;padding:9px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;color:var(--text)!important;font-size:13px!important;line-height:1.35}
.check-item input{flex:0 0 auto;width:18px;height:18px;margin:1px 0 0}
.check-item span{min-width:0;overflow-wrap:anywhere}.history-wrap{overflow-x:auto}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.history-detail{min-width:260px;white-space:normal;line-height:1.55}.history-note{min-width:180px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:720px){
.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.task-main{flex-direction:column}.app{padding:12px}
.history-table{display:block!important}
.history-table thead{display:none}
.history-table tbody,.history-table tr,.history-table td{display:block;width:100%!important}
.history-table tr{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}
.history-table td{padding:7px 8px!important;border:0!important;white-space:normal!important;overflow-wrap:anywhere;word-break:break-word}
.history-table td::before{display:inline-block;font-weight:700;color:var(--muted);margin-right:6px}
.history-table td:nth-child(1)::before{content:"完成日期 / 时间："}
.history-table td:nth-child(2)::before{content:"任务："}
.history-table td:nth-child(3)::before{content:"状态："}
.history-table td:nth-child(4)::before{content:"花费："}
.history-table td:nth-child(5)::before{content:"备注："}
.history-table td:nth-child(6)::before{content:"操作："}
.history-table .history-note{display:block;margin-top:4px}
 .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
 .photo-card{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f8fafc}
 .photo-card img{display:block;width:100%;height:110px;object-fit:cover;cursor:pointer}
 .photo-card button{position:absolute;right:4px;top:4px}
 .expense-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
 .expense-stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
 .expense-stat b{display:block;font-size:21px;margin-top:3px};min-width:0
 @media(max-width:720px){.expense-stats{grid-template-columns:1fr 1fr}.expense-stat:last-child{grid-column:1/-1}}

 .history-table td:nth-child(2){font-weight:700;font-size:15px}

}
@media(max-width:390px){.checklist-grid{grid-template-columns:1fr}}

.before-after-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-section{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafafa}.photo-section .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.before-after-history{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.before-after-history>div{min-width:0}.before-after-history strong{font-size:12px;color:var(--muted)}.before-after-history .photo-grid{grid-template-columns:repeat(auto-fill,minmax(75px,1fr))}.before-after-history .photo-card img{height:85px}.before-after-history>.btn{grid-column:1/-1}
.compare-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.compare-label{font-weight:700;font-size:13px;margin-bottom:5px}.compare-pair img{display:block;width:100%;max-height:42vh;object-fit:contain;background:#f8fafc;border:1px solid var(--line);border-radius:10px;cursor:pointer}.compare-empty{height:180px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
@media(max-width:720px){.before-after-grid,.before-after-history,.compare-pair{grid-template-columns:1fr}.before-after-history>.btn{grid-column:auto}}

.photo-pick{position:relative;background:#fff;border:1px solid var(--line);color:var(--text)}
.photo-section .meta{line-height:1.45}
.photo-badge{display:inline-flex;align-items:center;gap:4px;margin:7px 0 0 0;padding:3px 7px;border-radius:999px;background:#eaf6ff;color:#2776a8;font-size:11px;font-weight:700}
.compare-wrap{padding-bottom:4px}
@media(max-width:720px){
 .before-after-grid{display:grid!important;grid-template-columns:1fr!important;gap:12px!important}
 .photo-section{padding:12px}
 .photo-pick{min-height:44px}
 .before-after-history{display:grid!important;grid-template-columns:1fr!important}
 .before-after-history>.btn{width:100%;min-height:42px}
 .compare-pair{display:grid!important;grid-template-columns:1fr!important;gap:8px}
}

function clone(v){return JSON.parse(JSON.stringify(v))}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function calendarToday(){
 const d=new Date();
 return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function today(){
 const d=new Date();
 if(d.getHours()<DAY_START_HOUR)d.setDate(d.getDate()-1);
 return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseISO(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addPeriod(d,n,u){
 const x=new Date(d);
 if(u==='nightly'||u==='day')x.setDate(x.getDate()+n);
 else if(u==='week')x.setDate(x.getDate()+7*n);
 else if(u==='month'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
 else if(u==='year'){const m=x.getMonth(),day=x.getDate();x.setDate(1);x.setFullYear(x.getFullYear()+n);x.setMonth(m);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
 return x
}
function diff(a,b){return Math.round((parseISO(a)-parseISO(b))/86400000)}
function typeLabel(id){return db.settings.types.find(x=>x.id===id)?.label||id}
function areaLabel(id){return db.settings.areas.find(x=>x.id===id)?.label||id}

function freq(t){if(t.unit==='nightly')return '每晚';if(t.unit==='day')return t.interval===1?'每天':`每${t.interval}天`;if(t.unit==='week')return t.interval===1?'每周':`每${t.interval}周`;if(t.unit==='month')return t.interval===1?'每月':`每${t.interval}个月`;return t.interval===1?'每年':`每${t.interval}年`}
function status(t){if(!t.enabled)return 'disabled';const d=diff(t.nextDue,iso(today()));return d<0?'overdue':d===0?'today':'upcoming'}
function statusHTML(t){const s=status(t);if(s==='overdue')return `<span class="badge red">逾期 ${Math.abs(diff(t.nextDue,iso(today())))} 天</span>`;if(s==='today')return `<span class="badge orange">今天到期</span>`;if(s==='upcoming')return `<span class="badge green">${diff(t.nextDue,iso(today()))} 天后</span>`;return `<span class="badge gray">已停用</span>`}

 return {tasks,archivedHistory:[],settings:{types:clone(TYPES_DEFAULT),areas:clone(AREAS_DEFAULT)}}
}
function normalize(x){
 if(!x||!Array.isArray(x.tasks))x=defaultDB();
 if(!Array.isArray(x.archivedHistory))x.archivedHistory=[];if(!x.settings)x.settings={};
 if(!Array.isArray(x.settings.types)||!x.settings.types.length)x.settings.types=clone(TYPES_DEFAULT);
 if(!Array.isArray(x.settings.areas)||!x.settings.areas.length)x.settings.areas=clone(AREAS_DEFAULT);
 x.settings.areas.forEach(a=>{if(!Array.isArray(a.subs))a.subs=[]});

}

function ensureDriveClient(){

 if(!window.google?.accounts?.oauth2)return false;
 driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID,scope:DRIVE_SCOPE,callback:()=>{}});
 return true;
}
function getDriveToken(interactive=false){
 if(driveAccessToken && Date.now()<driveTokenExpiresAt-60000)return Promise.resolve(driveAccessToken);
 if(driveTokenPromise)return driveTokenPromise;
 driveTokenPromise=new Promise((resolve,reject)=>{
  let waited=0;
  const run=()=>{
   if(!ensureDriveClient()){
    if(waited<10000){waited+=250;setTimeout(run,250);return}
    driveTokenPromise=null;reject(new Error('Google Identity Services 尚未加载'));return;
   }
   driveTokenClient.callback=(r)=>{
    driveTokenPromise=null;
    if(r&&r.access_token){
      driveAccessToken=r.access_token;
      driveTokenExpiresAt=Date.now()+(Number(r.expires_in)||3600)*1000;
      resolve(driveAccessToken);
    } else {
      const err=new Error(r?.error||'Google 授权失败');
      err.googleError=r?.error||'';
      reject(err);
    }
   };
   try{
    // 空 prompt 优先复用已有授权，不主动弹“选择 Google 账号”。
    // 只有在确实没有授权/授权失效时，才由调用方显式要求 interactive。
    driveTokenClient.requestAccessToken({prompt:''});
   }catch(e){driveTokenPromise=null;reject(e)}
  };
  run();
 });
 return driveTokenPromise;
}
async function ensureDriveAuthorization(){
 try{return await getDriveToken(false)}
 catch(e){
  // 仅在静默授权无法完成时才弹一次授权窗口；正常的再次同步不会反复选择账号。
  if(e?.googleError==='interaction_required'||e?.googleError==='login_required'||e?.googleError==='consent_required'){
   return await getDriveToken(true);
  }
  throw e;
 }
}
async function getDriveTokenInteractive(){
 if(driveAccessToken && Date.now()<driveTokenExpiresAt-60000)return driveAccessToken;
 if(!ensureDriveClient())throw new Error('Google Identity Services 尚未加载');
 if(driveTokenPromise)return driveTokenPromise;
 driveTokenPromise=new Promise((resolve,reject)=>{
  driveTokenClient.callback=(r)=>{
   driveTokenPromise=null;
   if(r&&r.access_token){driveAccessToken=r.access_token;driveTokenExpiresAt=Date.now()+(Number(r.expires_in)||3600)*1000;resolve(driveAccessToken)}
   else {const err=new Error(r?.error||'Google 授权失败');err.googleError=r?.error||'';reject(err)}
  };
  try{driveTokenClient.requestAccessToken({prompt:'consent'})}catch(e){driveTokenPromise=null;reject(e)}
 });
 return driveTokenPromise;
}
async function driveFetch(url,opts={},retry=true){
 const token=await getDriveToken(false);
 const headers={...(opts.headers||{}),Authorization:`Bearer ${token}`};
 const r=await fetch(url,{...opts,headers});
 if(r.status===401&&retry){driveAccessToken='';driveTokenExpiresAt=0;return driveFetch(url,opts,false)}
 if(!r.ok){let msg='';try{msg=await r.text()}catch(_){};throw new Error(`Drive ${r.status}: ${msg||r.statusText}`)}
 return r;
}

function driveXhr(url,opts={},onProgress){
 return new Promise(async(resolve,reject)=>{
  try{
   const token=await getDriveToken(false);
   const xhr=new XMLHttpRequest();
   xhr.open(opts.method||'GET',url,true);
   const headers=opts.headers||{};
   Object.keys(headers).forEach(k=>xhr.setRequestHeader(k,headers[k]));
   xhr.setRequestHeader('Authorization',`Bearer ${token}`);
   xhr.upload.onprogress=e=>{
    if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total);
   };
   xhr.onprogress=e=>{
    if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total);
   };
   xhr.onload=()=>{
    if(xhr.status===401){
     driveAccessToken='';driveTokenExpiresAt=0;
     reject(Object.assign(new Error('Drive 401'),{retryable401:true}));
     return;
    }
    if(xhr.status<200||xhr.status>=300){
     reject(new Error(`Drive ${xhr.status}: ${xhr.responseText||xhr.statusText}`));return;
    }
    resolve(xhr);
   };
   xhr.onerror=()=>reject(new Error('网络连接失败'));
   xhr.onabort=()=>reject(new Error('同步已取消'));
   xhr.send(opts.body||null);
  }catch(e){reject(e)}
 });
}

function multipartBody(metadata,blob,boundary){return new Blob([`--${boundary}\r\n`,`Content-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(metadata),`\r\n--${boundary}\r\n`,`Content-Type: application/json\r\n\r\n`,blob,`\r\n--${boundary}--`])}
async function uploadDrivePayload(mode='manual'){
 if(driveBusy)return;

 try{
  await ensureDriveAuthorization();

  const url=fileId
   ?`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=multipart&fields=id,name,modifiedTime`
   :`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime`;
  driveProgress(true,32,`正在上传同步文件（${(body.size/1024/1024).toFixed(1)} MB）`);

    p=>driveProgress(true,32+Math.round(p*66),`正在上传同步文件（${Math.round(p*100)}%）`));
  }catch(e){
   if(e?.retryable401){
    await ensureDriveAuthorization();

      p=>driveProgress(true,32+Math.round(p*66),`正在上传同步文件（${Math.round(p*100)}%）`));
   }else throw e;
  }
  const f=JSON.parse(xhr.responseText||'{}');

 }
}

function completionTime(h){
  if(h.completedAt)return String(h.completedAt);

  return '';
}
function formatCompletedAt(h){
  if(!h.completedAt)return '';
  const d=new Date(h.completedAt);
  if(Number.isNaN(d.getTime()))return '';
  return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function historySort(a,b){
 const da=String(a.date||'').trim();
 const db=String(b.date||'').trim();
 // 完成日期是历史记录的第一排序键：日期越新越靠上。
 const dateA=Date.parse(da+'T00:00:00');
 const dateB=Date.parse(db+'T00:00:00');
 if(Number.isFinite(dateA)||Number.isFinite(dateB)){
  if(!Number.isFinite(dateA))return 1;
  if(!Number.isFinite(dateB))return -1;
  if(dateA!==dateB)return dateB-dateA;
 }
 // 同一天才比较实际保存/完成时间：越晚越靠上。
 const ta=String(a.completedAt||'');
 const tb=String(b.completedAt||'');
 if(ta&&!tb)return -1;
 if(!ta&&tb)return 1;
 if(ta&&tb){
  const timeA=Date.parse(ta),timeB=Date.parse(tb);
  if(Number.isFinite(timeA)&&Number.isFinite(timeB)&&timeA!==timeB)return timeB-timeA;
  return tb.localeCompare(ta);
 }
 return 0;
}

const PHOTO_DB='houseMaintenancePhotos_v1';
let photoDBPromise=null;
function openPhotoDB(){
 if(photoDBPromise)return photoDBPromise;
 photoDBPromise=new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return}
  const r=indexedDB.open(PHOTO_DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'key'})};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB open failed'));
 });
 return photoDBPromise
}
function photoKey(historyId,kind,index){return `${historyId}::${kind}::${index}`}
async function idbPutPhotos(historyId,kind,photos){
 historyPhotoIdSet=null;
 const dbi=await openPhotoDB();
 return new Promise((resolve,reject)=>{
  const tx=dbi.transaction('photos','readwrite'),st=tx.objectStore('photos');
  photos.forEach((p,i)=>st.put({key:photoKey(historyId,kind,i),historyId,kind,index:i,data:p.data}));
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('photo save failed'));
 })
}
async function idbGetPhotos(historyId,kind){
 const dbi=await openPhotoDB();
 return new Promise((resolve,reject)=>{
  const tx=dbi.transaction('photos','readonly'),st=tx.objectStore('photos'),out=[];
  const req=st.openCursor();
  req.onsuccess=()=>{const c=req.result;if(!c){resolve(out.sort((a,b)=>a.index-b.index));return}const v=c.value;if(String(v.historyId)===String(historyId)&&v.kind===kind)out.push(v);c.continue()};
  req.onerror=()=>reject(req.error||new Error('photo read failed'));
 })
}
let historyPhotoIdSet=null;
let historyPhotoScanPromise=null;
async function scanHistoryPhotoIds(){
 if(historyPhotoIdSet)return historyPhotoIdSet;
 if(historyPhotoScanPromise)return historyPhotoScanPromise;
 historyPhotoScanPromise=new Promise((resolve,reject)=>{
  try{
   const tx=dbi.transaction('photos','readonly'),st=tx.objectStore('photos'),set=new Set(),req=st.openCursor();
   req.onsuccess=()=>{const c=req.result;if(!c){historyPhotoIdSet=set;resolve(set);return}const v=c.value;if(v&&v.historyId)set.add(String(v.historyId));c.continue()};
   req.onerror=()=>reject(req.error||new Error('photo index scan failed'));
  }catch(e){reject(e)}
 }).finally(()=>{historyPhotoScanPromise=null});
 return historyPhotoScanPromise;
}
function hasHistoryPhotos(h){return !!(h&&(Number(h.photoCount)>0||(Array.isArray(h.beforePhotos)&&h.beforePhotos.length)||(Array.isArray(h.afterPhotos)&&h.afterPhotos.length)||(Array.isArray(h.photos)&&h.photos.length)||(historyPhotoIdSet&&historyPhotoIdSet.has(String(h.id)))))}
async function idbDeleteHistoryPhotos(historyId){
 historyPhotoIdSet=null;
 const dbi=await openPhotoDB();
 return new Promise((resolve,reject)=>{
  const tx=dbi.transaction('photos','readwrite'),st=tx.objectStore('photos'),req=st.openCursor();
  req.onsuccess=()=>{const c=req.result;if(!c)return;if(String(c.value.historyId)===String(historyId))c.delete();c.continue()};
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('photo delete failed'));
 })
}
async function persistHistoryPhotos(h){
 const b=Array.isArray(h.beforePhotos)?h.beforePhotos:[],a=Array.isArray(h.afterPhotos)?h.afterPhotos:[];
 if(!b.length&&!a.length)return;
 await Promise.all([idbPutPhotos(h.id,'before',b),idbPutPhotos(h.id,'after',a)]);
}
async function hydrateHistoryPhotos(h){
 try{
  if(!h||!h.id)return;
  const [b,a]=await Promise.all([idbGetPhotos(h.id,'before'),idbGetPhotos(h.id,'after')]);
  if((!Array.isArray(h.beforePhotos)||!h.beforePhotos.length)&&b.length)h.beforePhotos=b.map(x=>({data:x.data}));
  if((!Array.isArray(h.afterPhotos)||!h.afterPhotos.length)&&a.length)h.afterPhotos=a.map(x=>({data:x.data}));
 }catch(_){}
}
async function hydrateAllPhotos(){
 const jobs=[];
 db.tasks.forEach(t=>(t.history||[]).forEach(h=>jobs.push(hydrateHistoryPhotos(h))));
 (db.archivedHistory||[]).forEach(h=>jobs.push(hydrateHistoryPhotos(h)));
 await Promise.all(jobs);render();
}
async function persistAllInlinePhotos(listDb=db){
 const jobs=[];
 listDb.tasks.forEach(t=>(t.history||[]).forEach(h=>{
  if((h.beforePhotos&&h.beforePhotos.length)||(h.afterPhotos&&h.afterPhotos.length))jobs.push(persistHistoryPhotos(h));
 }));
 (listDb.archivedHistory||[]).forEach(h=>{
  if((h.beforePhotos&&h.beforePhotos.length)||(h.afterPhotos&&h.afterPhotos.length))jobs.push(persistHistoryPhotos(h));
 });
 await Promise.all(jobs);
}

function compressPhoto(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>{
   const img=new Image();img.onload=()=>{
    const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),hh=Math.max(1,Math.round(img.naturalHeight*s));
    const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);
    cv.toBlob(b=>{if(!b)return reject();const rr=new FileReader();rr.onload=()=>resolve(rr.result);rr.onerror=reject;rr.readAsDataURL(b)},'image/jpeg',.82)
   };img.onerror=reject;img.src=r.result
  };r.onerror=reject;r.readAsDataURL(file)
 })
}

function reopenCompleteState(state){

async function saveComplete(id,force){
 if(!window.__completeSaving)window.__completeSaving=new Set();
 if(window.__completeSaving.has(id))return;
 window.__completeSaving.add(id);
 try{
 if((window.photoProcessing||0)>0){toast('照片仍在处理中，请稍候再保存');window.__completeSaving.delete(id);return}
 const state=(force&&window.pendingComplete&&window.pendingComplete.id===id)?window.pendingComplete:captureCompleteState(id);if(!state){window.__completeSaving.delete(id);return;}
 const unchecked=state.checklist.filter(x=>!x.done).length;
 if(unchecked&&!force){
  window.pendingComplete=state;
  modal('还有 Checklist 未完成',`<div class="notice">还有 <strong>${unchecked}</strong> 个小项没有完成。你可以返回继续勾选，也可以跳过这些小项并完成整个任务。</div><div class="actions"><button type="button" class="btn" data-cmd="complete-back">返回继续勾选</button><button type="button" class="btn primary" data-cmd="complete-force-save" data-id="${esc(id)}">确定跳过并完成</button></div>`);
  window.__completeSaving.delete(id);return
 }
 const t=db.tasks.find(x=>x.id===id);if(!t){window.__completeSaving.delete(id);return;}
 const snapshot=clone(db);
 t.lastCompleted=state.date;
 // 每日/每晚任务按“维护日”计算下一次刷新：
 // 10:00 前完成的实际日历日期仍属于前一天维护日，因此下一次应在今天 10:00 后刷新。
 const selectedDate=state.date||iso(calendarToday());
 const currentCalendarDate=iso(calendarToday());
 const scheduleBase=(t.unit==='day'||t.unit==='nightly')&&selectedDate===currentCalendarDate?today():parseISO(selectedDate);
 t.nextDue=iso(addPeriod(scheduleBase,t.unit==='nightly'?1:t.interval,t.unit==='nightly'?'day':t.unit));
 t.history.unshift({id:uid('hist'),date:state.date||iso(calendarToday()),completedAt:new Date().toISOString(),condition:state.condition,cost:state.cost,notes:state.notes,temperature:state.temperature,beforePhotos:state.beforePhotos,afterPhotos:state.afterPhotos,photoCount:(state.beforePhotos||[]).length+(state.afterPhotos||[]).length,checklistResults:state.checklist});
 if(!save()){db=snapshot;window.__completeSaving.delete(id);return}
 const savedHistory=t.history[0];
 try{await persistHistoryPhotos(savedHistory)}
 catch(e){toast('记录已保存，但照片无法保存到浏览器照片库')}
 window.pendingComplete=null;window.__completeSaving.delete(id);closeModal();render();toast('完成记录已保存')
 }catch(err){window.__completeSaving.delete(id);throw err}
}
function comparePhotosModal(h){

}

async function saveHistoryPhotos(){

 const h=findHistoryRecord(s.taskId,s.historyId,s.archived);if(!h)return;
 const snapshot=clone(db);
 h.beforePhotos=clone(s.beforePhotos||[]);h.afterPhotos=clone(s.afterPhotos||[]);h.photoCount=h.beforePhotos.length+h.afterPhotos.length;delete h.photos;
 if(!save()){db=snapshot;return}
 try{await idbDeleteHistoryPhotos(h.id);await persistHistoryPhotos(h);window.pendingHistoryPhoto=null;closeModal();render();toast('历史照片已更新')}
 catch(e){db=snapshot;save();toast('照片保存失败，未完成更新')}
}
async function handleHistoryPhotoFiles(kind,files){
 const s=window.pendingHistoryPhoto;if(!s)return;const fs=Array.from(files||[]);if(!fs.length)return;
 window.historyPhotoProcessing=(window.historyPhotoProcessing||0)+fs.length;
 try{const xs=await Promise.all(fs.map(compressPhoto));const key=kind==='before'?'beforePhotos':'afterPhotos';s[key]=(s[key]||[]).concat(xs.map(data=>({data})));const p=document.getElementById('history-'+kind+'-preview');if(p)p.innerHTML=historyPhotoPreview(s[key],kind)}
 catch(e){toast('照片处理失败')}
 finally{window.historyPhotoProcessing=Math.max(0,(window.historyPhotoProcessing||0)-fs.length)}
}

function deleteHistory(taskId,historyId,archived){
 if(!confirm('确定删除这条历史记录吗？'))return;
 if(archived==='1'){
  db.archivedHistory=(db.archivedHistory||[]).filter(h=>h.id!==historyId);
 }else{
  const t=db.tasks.find(x=>x.id===taskId);
  if(t)t.history=(t.history||[]).filter(h=>h.id!==historyId);
 }
 if(save()){idbDeleteHistoryPhotos(historyId).catch(()=>{});render();toast('历史记录已删除')};
}
function deleteTaskConfirm(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;modal('确认删除任务',`<div class="notice">确定删除 <strong>${esc(t.name)}</strong> 吗？<br>该任务的历史记录会保留在“历史”中。</div><div class="actions"><button type="button" class="btn" data-cmd="modal-close">取消</button><button type="button" class="btn danger" data-cmd="task-delete-confirm" data-id="${esc(id)}">确定删除</button></div>`)}
function snoozeModal(id){modal('延期任务',`<form class="form" id="snoozeForm"><label>延后天数<input required type="number" min="1" step="1" name="days" value="7"></label><div class="actions"><button type="button" class="btn primary" data-cmd="snooze-save" data-id="${esc(id)}">保存延期</button></div></form>`)}
function saveSnooze(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;const snapshot=clone(db);const f=new FormData(document.getElementById('snoozeForm')),n=Math.max(1,parseInt(f.get('days'))||1);t.nextDue=iso(addPeriod(parseISO(t.nextDue),n,'day'));if(!save()){db=snapshot;return}closeModal();render();toast('任务已延期')}
function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;const snapshot=clone(db);t.enabled=!t.enabled;if(!save()){db=snapshot;return}render();toast(t.enabled?'任务已启用':'任务已停用')}

function typeEditor(id){const x=id?db.settings.types.find(v=>v.id===id):null;modal(x?'编辑任务类型':'新增任务类型',`<form id="typeForm" class="form"><input type="hidden" name="id" value="${x?esc(x.id):''}"><label>类型名称<input required name="label" value="${x?esc(x.label):''}"></label><div class="actions"><button type="button" class="btn primary" data-settings="type-save">保存</button></div></form>`)}
function typeDelete(id){const x=db.settings.types.find(v=>v.id===id);if(!x)return;if(db.settings.types.length<=1){toast('至少保留一个任务类型');return}modal('删除任务类型',`<div class="notice">删除“${esc(x.label)}”后，使用它的任务会自动移动到其他类型。</div><div class="actions"><button type="button" class="btn" data-cmd="modal-close">取消</button><button type="button" class="btn danger" data-settings="type-delete-confirm" data-id="${esc(id)}">确定删除</button></div>`)}
function typeSave(){const snapshot=clone(db);const f=new FormData(document.getElementById('typeForm')),id=f.get('id'),label=String(f.get('label')||'').trim();if(!label)return;const x=id?db.settings.types.find(v=>v.id===id):null;if(x)x.label=label;else db.settings.types.push({id:uid('type'),label});if(!save()){db=snapshot;return}closeModal();render();toast('类型已保存')}
function typeDeleteConfirm(id){const snapshot=clone(db);const remain=db.settings.types.filter(v=>v.id!==id),fallback=remain[0]?.id;if(!fallback){toast('至少保留一个任务类型');return}db.tasks.forEach(t=>{if(t.type===id)t.type=fallback});db.settings.types=remain;if(!save()){db=snapshot;return}closeModal();render();toast('类型已删除')}

function areaEditor(id){const x=id?db.settings.areas.find(v=>v.id===id):null;modal(x?'编辑区域':'新增区域',`<form id="areaForm" class="form"><input type="hidden" name="id" value="${x?esc(x.id):''}"><label>区域名称<input required name="label" value="${x?esc(x.label):''}"></label><div class="actions"><button type="button" class="btn primary" data-settings="area-save">保存</button></div></form>`)}
function areaDelete(id){const x=db.settings.areas.find(v=>v.id===id);if(!x)return;if(db.settings.areas.length<=1){toast('至少保留一个区域');return}modal('删除区域',`<div class="notice">删除“${esc(x.label)}”后，相关任务会自动移动到其他区域。</div><div class="actions"><button type="button" class="btn" data-cmd="modal-close">取消</button><button type="button" class="btn danger" data-settings="area-delete-confirm" data-id="${esc(id)}">确定删除</button></div>`)}
function areaSave(){const snapshot=clone(db);const f=new FormData(document.getElementById('areaForm')),id=f.get('id'),label=String(f.get('label')||'').trim();if(!label)return;const x=id?db.settings.areas.find(v=>v.id===id):null;if(x)x.label=label;else db.settings.areas.push({id:uid('area'),label,subs:[]});if(!save()){db=snapshot;return}closeModal();render();toast('区域已保存')}
function areaDeleteConfirm(id){const snapshot=clone(db);const remain=db.settings.areas.filter(v=>v.id!==id),fallback=remain[0];if(!fallback){toast('至少保留一个区域');return}db.tasks.forEach(t=>{if(t.area===id){t.area=fallback.id;t.sub=fallback.subs[0]?.id||''}});db.settings.areas=remain;if(!save()){db=snapshot;return}closeModal();render();toast('区域已删除')}

function subEditor(areaId,subId){const a=db.settings.areas.find(v=>v.id===areaId),x=a?.subs?.find(v=>v.id===subId);if(!a)return;modal(x?'编辑子区域':'新增子区域',`<form id="subForm" class="form"><input type="hidden" name="area" value="${esc(areaId)}"><input type="hidden" name="id" value="${x?esc(x.id):''}"><label>子区域名称<input required name="label" value="${x?esc(x.label):''}"></label><div class="actions"><button type="button" class="btn primary" data-settings="sub-save">保存</button></div></form>`)}
function subDelete(areaId,subId){const a=db.settings.areas.find(v=>v.id===areaId),x=a?.subs?.find(v=>v.id===subId);if(!a||!x)return;if(a.subs.length<=1){toast('至少保留一个子区域');return}modal('删除子区域',`<div class="notice">删除“${esc(x.label)}”后，使用它的任务会自动移动到该区域的其他子区域。</div><div class="actions"><button type="button" class="btn" data-cmd="modal-close">取消</button><button type="button" class="btn danger" data-settings="sub-delete-confirm" data-area="${esc(areaId)}" data-id="${esc(subId)}">确定删除</button></div>`)}
function subSave(){const snapshot=clone(db);const f=new FormData(document.getElementById('subForm')),area=f.get('area'),id=f.get('id'),label=String(f.get('label')||'').trim();if(!label)return;const a=db.settings.areas.find(v=>v.id===area);if(!a)return;const x=id?a.subs.find(v=>v.id===id):null;if(x)x.label=label;else a.subs.push({id:uid('sub'),label});if(!save()){db=snapshot;return}closeModal();render();toast('子区域已保存')}
function subDeleteConfirm(area,id){const snapshot=clone(db);const a=db.settings.areas.find(v=>v.id===area);if(!a)return;const remain=a.subs.filter(v=>v.id!==id),fallback=remain[0]?.id;db.tasks.forEach(t=>{if(t.area===area&&t.sub===id)t.sub=fallback});a.subs=remain;if(!save()){db=snapshot;return}closeModal();render();toast('子区域已删除')}

async function exportData(){try{await hydrateAllPhotos();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`house-maintenance-v4-${iso(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}catch(e){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`house-maintenance-v4-${iso(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('照片库读取失败，已导出当前数据')}}
function resetData(){const snapshot=clone(db);db=defaultDB();if(!save()){db=snapshot;return}closeModal();render();toast('已恢复初始数据')}
function importData(file){const r=new FileReader();r.onload=async()=>{try{const incoming=normalize(JSON.parse(r.result)),snapshot=clone(db);db=incoming;if(!save()){db=snapshot;return}try{await persistAllInlinePhotos(db)}catch(e){toast('数据已导入，但部分照片无法恢复到照片库')}render();await hydrateAllPhotos();toast('导入成功')}catch(e){alert('导入失败：不是有效的备份文件')}};r.readAsText(file)}

document.addEventListener('submit',function(e){
 if(e.target && e.target.id==='completeForm'){
  e.preventDefault();
  const btn=e.target.querySelector('[data-complete-save-id]');
  const id=btn?.dataset.completeSaveId;
  if(id) saveComplete(id,false).catch(err=>{console.error('完成任务失败',err);toast('完成失败，请重试');});
 }
});

document.addEventListener('click',async function(e){
 const nav=e.target.closest('[data-page]');
 if(nav){page=nav.dataset.page;render();return}
 const s=e.target.closest('[data-settings]');
 if(s){
  const a=s.dataset.settings,id=s.dataset.id,area=s.dataset.area;
  if(a==='type-add')typeEditor();else if(a==='type-edit')typeEditor(id);else if(a==='type-delete')typeDelete(id);else if(a==='type-save')typeSave();else if(a==='type-delete-confirm')typeDeleteConfirm(id);
  else if(a==='area-add')areaEditor();else if(a==='area-edit')areaEditor(id);else if(a==='area-delete')areaDelete(id);else if(a==='area-save')areaSave();else if(a==='area-delete-confirm')areaDeleteConfirm(id);
  else if(a==='sub-add')subEditor(area);else if(a==='sub-edit')subEditor(area,id);else if(a==='sub-delete')subDelete(area,id);else if(a==='sub-save')subSave();else if(a==='sub-delete-confirm')subDeleteConfirm(area,id);
  return
 }
 const d=e.target.closest('[data-drive]');
 if(d){const a=d.dataset.drive;if(a==='connect')connectDrive();else if(a==='disconnect')disconnectDrive();else if(a==='sync')uploadDrivePayload('manual');else if(a==='restore'){if(confirm('从云端恢复会覆盖当前本机任务、历史、分类和设置，确定继续吗？'))restoreFromDrive();}return}
 const da=e.target.closest('[data-drive-auto]');
 if(da){toggleDriveAuto(da);return}
 const c=e.target.closest('[data-cmd]');
 if(c){
  const a=c.dataset.cmd,id=c.dataset.id;
  if(a==='photo-view'){const src=c.dataset.src;if(src)modal('照片',`<img src="${src}" style="display:block;max-width:100%;max-height:75vh;margin:auto;border-radius:10px">`);return}
   if(a==='photo-delete'){const k=c.dataset.kind||'after',arr=k==='before'?window.pendingBeforePhotos:window.pendingAfterPhotos;if(Array.isArray(arr)){arr.splice(Number(c.dataset.index),1);const p=document.getElementById(k+'PhotoPreview');if(p)p.innerHTML=photoHTML(arr,false,k)}return}
   if(a==='history-photo-edit'){
 const h=findHistoryRecord(c.dataset.task,c.dataset.history,c.dataset.archived==='1');
 if(h){await hydrateHistoryPhotos(h);historyPhotoEditor(c.dataset.task,c.dataset.history,c.dataset.archived==='1');}
 return
}
   if(a==='history-photo-delete'){const s=window.pendingHistoryPhoto;if(s){const k=c.dataset.kind==='before'?'beforePhotos':'afterPhotos';(s[k]||[]).splice(Number(c.dataset.index),1);const p=document.getElementById('history-'+c.dataset.kind+'-preview');if(p)p.innerHTML=historyPhotoPreview(s[k],c.dataset.kind)}return}
   if(a==='history-photo-save'){saveHistoryPhotos();return}
   if(a==='photo-compare'){
 const taskId=c.dataset.task,historyId=c.dataset.history,archived=c.dataset.archived==='1';
 const h=findHistoryRecord(taskId,historyId,archived);
 if(h){await hydrateHistoryPhotos(h);comparePhotosModal(h);}
 return
}
   if(a==='task-add')taskEditor();else if(a==='task-edit')taskEditor(id);else if(a==='task-complete')completeModal(id);else if(a==='task-delete')deleteTaskConfirm(id);else if(a==='task-delete-confirm'){
 const snapshot=clone(db);const t=db.tasks.find(x=>x.id===id);
 if(t){
  if(!Array.isArray(db.archivedHistory))db.archivedHistory=[];
  (t.history||[]).forEach(h=>db.archivedHistory.push({id:uid('arch'),taskId:null,task:t.name,...h}));
  db.tasks=db.tasks.filter(x=>x.id!==id);
 }
 if(!save()){db=snapshot;return}closeModal();render();toast('任务已删除，相关历史记录已保留')
}
  else if(a==='history-delete')deleteHistory(c.dataset.task,c.dataset.history,c.dataset.archived);
  else if(a==='task-snooze')snoozeModal(id);else if(a==='snooze-save')saveSnooze(id);else if(a==='task-toggle')toggleTask(id);else if(a==='task-save')saveTask();else if(a==='complete-save')saveComplete(id,false).catch(err=>{console.error('完成任务失败',err);toast('完成失败，请重试')});else if(a==='complete-force-save')saveComplete(id,true).catch(err=>{console.error('完成任务失败',err);toast('完成失败，请重试')});else if(a==='complete-back'){const state=window.pendingComplete;if(state)reopenCompleteState(state);else closeModal();}else if(a==='modal-close')closeModal();else if(a==='export')exportData();else if(a==='import')document.getElementById('fileInput').click();else if(a==='reset'){if(confirm('确定恢复全部初始数据吗？当前任务、历史和分类都会被覆盖。'))resetData()}
 }
});
let searchComposing=false,searchRenderTimer=null;
document.addEventListener('compositionstart',e=>{if(e.target.dataset.role==='search')searchComposing=true});
document.addEventListener('compositionend',e=>{
 if(e.target.dataset.role==='search'){
  searchComposing=false;window.q=e.target.value;renderTasks(document.getElementById('content'));
  const s=document.querySelector('[data-role="search"]');
  if(s){s.focus();try{s.setSelectionRange(s.value.length,s.value.length)}catch(_){}}
 }
});
document.addEventListener('input',e=>{
 if(e.target.dataset.role==='search'){
  window.q=e.target.value;if(searchComposing)return;
  clearTimeout(searchRenderTimer);
  searchRenderTimer=setTimeout(()=>{
   if(page!=='tasks')return;
   renderTasks(document.getElementById('content'));
   const s=document.querySelector('[data-role="search"]');
   if(s){s.focus();try{s.setSelectionRange(s.value.length,s.value.length)}catch(_){}}
  },0);
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='history-before-input'||e.target.id==='history-after-input'){const kind=e.target.id==='history-before-input'?'before':'after';handleHistoryPhotoFiles(kind,e.target.files||[]);e.target.value='';return}
 if(e.target.id==='beforePhotos'||e.target.id==='afterPhotos'){
 const kind=e.target.id==='beforePhotos'?'before':'after',fs=Array.from(e.target.files||[]);if(!fs.length)return;
 window.photoProcessing=(window.photoProcessing||0)+fs.length;
 Promise.all(fs.map(compressPhoto)).then(xs=>{const key=kind==='before'?'pendingBeforePhotos':'pendingAfterPhotos';window[key]=(window[key]||[]).concat(xs.map(data=>({data})));const p=document.getElementById(kind+'PhotoPreview');if(p)p.innerHTML=photoHTML(window[key],false,kind)})
 .catch(()=>toast('照片处理失败')).finally(()=>{window.photoProcessing=Math.max(0,(window.photoProcessing||0)-fs.length)});
 e.target.value='';return}
  
  if(e.target.dataset.role==='history-task'){window.historyTask=e.target.value;render();return}
 if(e.target.dataset.role==='filter'){window.f=e.target.value;render()}
 if(e.target.id==='taskArea'){const sub=document.getElementById('taskSub');if(sub)sub.innerHTML=subOpts(e.target.value,'')}
 if(e.target.id==='fileInput'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}
});
render();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
</script>
